name: CI - Automated Testing & Security Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Automated Tests & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend & Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci
          cd ..

      - name: Verify Backend Syntax Integrity
        run: node -c backend/server.js

      - name: Run Automated & Unit Test Suite
        run: npm test

      - name: Generate Code Coverage Report
        run: npm run test:coverage

      - name: Verify Frontend Production Build
        run: npm run build

  deploy-gate:
    name: Deployment Authorization Gate
    needs: test
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Authorize Deployment
        run: |
          echo "=========================================================="
          echo " All 38 automated unit, security and RBAC tests passed! "
          echo " Frontend and Backend production builds verified!        "
          echo " Deployment to Render & Vercel is APPROVED.              "
          echo "=========================================================="

      - name: Trigger Render Deploy (Gated Deployment)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deployment via verified Deploy Hook..."
            response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
            http_code=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "✅ Render deployment successfully triggered! HTTP $http_code"
            else
              echo "❌ Render deploy hook returned HTTP $http_code"
              echo "$response"
              exit 1
            fi
          else
            echo "ℹ️ Secret RENDER_DEPLOY_HOOK não configurada. Para que o GitHub Actions acione o deploy apenas após os testes passarem, configure o segredo no GitHub."
          fi

